# This profile is activated only by Gradle test tasks.
# H2 lives only in memory and is discarded when the test JVM exits.
spring:
  datasource:
    url: jdbc:h2:mem:lucent_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false
