name: Application CI/CD

on:
  push:
    branches: [develop]
  workflow_run:
    workflows: ["Infrastructure Pipeline"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: lucent-application-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test Lucent
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test Spring Boot backend
        shell: powershell
        working-directory: backend
        run: .\gradlew.bat test

      - name: Install frontend dependencies
        shell: powershell
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        shell: powershell
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy Lucent to AWS
    needs: build-and-test
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: lucent-infrastructure-production
      cancel-in-progress: false
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_database_password: ${{ secrets.TF_VAR_DATABASE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Isolate Runner from persisted AWS credentials
        shell: powershell
        run: |
          @(
            'AWS_PROFILE',
            'AWS_DEFAULT_PROFILE',
            'AWS_SHARED_CREDENTIALS_FILE',
            'AWS_CONFIG_FILE',
            'AWS_ACCESS_KEY_ID',
            'AWS_SECRET_ACCESS_KEY',
            'AWS_SESSION_TOKEN',
            'AWS_ROLE_ARN',
            'AWS_WEB_IDENTITY_TOKEN_FILE'
          ) | ForEach-Object {
            "$_=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::228755392058:role/LucentGitHubDeployRole
          aws-region: us-east-1
          role-duration-seconds: 3600
          allowed-account-ids: '228755392058'
          unset-current-credentials: true

      - name: Verify Sandbox AWS identity
        shell: powershell
        run: .\scripts\assert-aws-account.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Initialize Terraform Local State
        shell: powershell
        working-directory: infrastructure
        run: terraform init -reconfigure

      - name: Deploy application
        shell: powershell
        run: .\scripts\deploy.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure")

      - name: Verify application deployment
        shell: powershell
        run: .\scripts\verify.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure") -RequireBackendHttp

      - name: Verify deployed security
        shell: powershell
        run: .\scripts\security-verify.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure") -Ci
