name: Application CI/CD

on:
  push:
    branches: [develop]
  workflow_run:
    workflows: ["Infrastructure Pipeline"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lucent-application-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build, test, and deploy Lucent
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_SDK_LOAD_CONFIG: "1"
      TF_VAR_database_password: ${{ secrets.TF_VAR_DATABASE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Initialize Terraform remote state
        shell: powershell
        working-directory: infrastructure
        run: |
          $accountId = aws sts get-caller-identity --query Account --output text
          if (-not $accountId) { throw "Could not determine the AWS account ID." }
          terraform init -reconfigure "-backend-config=bucket=lucent-terraform-state-$accountId" "-backend-config=key=lucent/terraform.tfstate" "-backend-config=region=us-east-1" "-backend-config=encrypt=true" "-backend-config=use_lockfile=true"

      - name: Test Spring Boot backend
        shell: powershell
        working-directory: backend
        run: .\gradlew.bat test

      - name: Install frontend dependencies
        shell: powershell
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        shell: powershell
        working-directory: frontend
        run: npm run build

      - name: Deploy application
        shell: powershell
        run: .\scripts\deploy.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure")

      - name: Verify application deployment
        shell: powershell
        run: .\scripts\verify.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure") -RequireBackendHttp

      - name: Verify deployed security
        shell: powershell
        run: .\scripts\security-verify.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure") -Ci
