name: Application CI/CD

on:
  push:
    branches: [develop]
  workflow_run:
    workflows: ["Infrastructure Pipeline"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lucent-application-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test Lucent
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test Spring Boot backend
        shell: powershell
        working-directory: backend
        run: .\gradlew.bat test

      - name: Install frontend dependencies
        shell: powershell
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        shell: powershell
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy Lucent to AWS
    needs: build-and-test
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    concurrency:
      group: lucent-infrastructure-production
      cancel-in-progress: false
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_SDK_LOAD_CONFIG: "1"
      TF_VAR_database_password: ${{ secrets.TF_VAR_DATABASE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Configure AWS Academy identity
        shell: powershell
        env:
          ACADEMY_AWS_ACCESS_KEY_ID: ${{ secrets.ACADEMY_AWS_ACCESS_KEY_ID }}
          ACADEMY_AWS_SECRET_ACCESS_KEY: ${{ secrets.ACADEMY_AWS_SECRET_ACCESS_KEY }}
          ACADEMY_AWS_SESSION_TOKEN: ${{ secrets.ACADEMY_AWS_SESSION_TOKEN }}
        run: |
          $required = @(
            'ACADEMY_AWS_ACCESS_KEY_ID', 'ACADEMY_AWS_SECRET_ACCESS_KEY',
            'ACADEMY_AWS_SESSION_TOKEN'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required GitHub Secret is missing: $name"
            }
          }

          $credentialsFile = Join-Path $env:RUNNER_TEMP 'lucent-academy-aws-credentials'
          $credentials = @"
          aws_access_key_id=$env:ACADEMY_AWS_ACCESS_KEY_ID
          aws_secret_access_key=$env:ACADEMY_AWS_SECRET_ACCESS_KEY
          aws_session_token=$env:ACADEMY_AWS_SESSION_TOKEN
          "@
          [System.IO.File]::WriteAllText($credentialsFile, $credentials, [System.Text.UTF8Encoding]::new($false))
          "AWS_SHARED_CREDENTIALS_FILE=$credentialsFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AWS_PROFILE=default" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LUCENT_AWS_CREDENTIALS_FILE=$credentialsFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Initialize Terraform Local State
        shell: powershell
        working-directory: infrastructure
        run: terraform init -reconfigure

      - name: Deploy application
        shell: powershell
        run: .\scripts\deploy.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure")

      - name: Verify application deployment
        shell: powershell
        run: .\scripts\verify.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure") -RequireBackendHttp

      - name: Verify deployed security
        shell: powershell
        run: .\scripts\security-verify.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure") -Ci

      - name: Remove temporary AWS credentials
        if: always()
        shell: powershell
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:LUCENT_AWS_CREDENTIALS_FILE)) {
            Remove-Item -LiteralPath $env:LUCENT_AWS_CREDENTIALS_FILE -Force -ErrorAction SilentlyContinue
          }
