name: Application CI/CD

on:
  push:
    branches: [develop]
  workflow_run:
    workflows: ["Infrastructure Pipeline"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: lucent-application-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test Lucent
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test Spring Boot backend
        shell: powershell
        working-directory: backend
        run: .\gradlew.bat test

      - name: Install frontend dependencies
        shell: powershell
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        shell: powershell
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy Lucent to AWS
    needs: build-and-test
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: lucent-infrastructure-production
      cancel-in-progress: false
    env:
      AWS_DEFAULT_REGION: eu-west-1
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_database_password: ${{ secrets.TF_VAR_DATABASE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Diagnose GitHub OIDC Subject
        shell: powershell
        run: |
          $uri = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com"

          $response = Invoke-RestMethod -Uri $uri -Headers @{
            Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          }

          $part = $response.value.Split('.')[1].Replace('-', '+').Replace('_', '/')
          $part += '=' * ((4 - ($part.Length % 4)) % 4)

          $claims = [System.Text.Encoding]::UTF8.GetString(
            [Convert]::FromBase64String($part)
          ) | ConvertFrom-Json

          Write-Host "OIDC audience: $($claims.aud)"
          Write-Host "OIDC subject: $($claims.sub)"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::228755392058:role/LucentGitHubDeployRole
          aws-region: eu-west-1
          role-duration-seconds: 3600
          allowed-account-ids: '228755392058'
          unset-current-credentials: true

      - name: Diagnose assumed AWS identity
        shell: powershell
        run: |
          @('AWS_PROFILE', 'AWS_DEFAULT_PROFILE', 'AWS_SHARED_CREDENTIALS_FILE', 'AWS_CONFIG_FILE') | ForEach-Object {
            Remove-Item -Path ("Env:" + $_) -ErrorAction SilentlyContinue
          }

          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'

          try {
            aws sts get-caller-identity --output json
            $exitCode = $LASTEXITCODE
          }
          finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }

          if ($exitCode -ne 0) {
            throw "aws sts get-caller-identity failed with exit code $exitCode."
          }

      - name: Verify Sandbox AWS identity
        shell: powershell
        run: .\scripts\assert-aws-account.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Initialize Terraform Local State
        shell: powershell
        working-directory: infrastructure
        run: |
          @('AWS_PROFILE', 'AWS_DEFAULT_PROFILE', 'AWS_SHARED_CREDENTIALS_FILE', 'AWS_CONFIG_FILE') | ForEach-Object {
            Remove-Item -Path ("Env:" + $_) -ErrorAction SilentlyContinue
          }
          terraform init -reconfigure

      - name: Deploy application
        shell: powershell
        run: .\scripts\deploy.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure")

      # deploy.ps1 waits for CodeDeploy's successful lifecycle result. Do not
      # require every pre-existing ASG instance to be healthy here: instances
      # created before ASG integration have not yet received a revision.
      - name: Record successful CodeDeploy release for ASG promotion
        shell: powershell
        run: .\scripts\codedeploy-asg-integration-state.ps1 -Action MarkSuccessfulStageA -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure")

      - name: Promote CodeDeploy Deployment Group to Backend ASG integration
        shell: powershell
        run: .\scripts\promote-codedeploy-asg-integration.ps1 -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure")

      - name: Verify CodeDeploy ASG integration
        shell: powershell
        run: .\scripts\codedeploy-asg-integration-state.ps1 -Action VerifyEnabled -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure")

      - name: Converge current Backend ASG through CodeDeploy
        shell: powershell
        run: .\scripts\reconcile-backend-codedeploy-asg.ps1 -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure")

      - name: Verify fully converged application
        shell: powershell
        run: .\scripts\verify.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure") -RequireBackendHttp

      - name: Verify final deployed security
        shell: powershell
        run: .\scripts\security-verify.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure") -Ci
