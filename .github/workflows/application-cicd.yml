name: Application CI/CD

on:
  push:
    branches: [develop]
  workflow_run:
    workflows: ["Infrastructure Pipeline"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lucent-application-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test Lucent
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test Spring Boot backend
        shell: powershell
        working-directory: backend
        run: .\gradlew.bat test

      - name: Install frontend dependencies
        shell: powershell
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        shell: powershell
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy Lucent to AWS
    needs: build-and-test
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    concurrency:
      group: lucent-infrastructure-production
      cancel-in-progress: false
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_SDK_LOAD_CONFIG: "1"
      TF_VAR_database_password: ${{ secrets.TF_VAR_DATABASE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Verify AWS Academy identity on the self-hosted Runner
        shell: powershell
        run: |
          $credentialsPath = Join-Path $env:USERPROFILE '.aws\credentials'
          if (-not (Test-Path -LiteralPath $credentialsPath -PathType Leaf)) {
            throw "AWS Academy credentials are unavailable on this Runner: $credentialsPath"
          }
          aws sts get-caller-identity --output json
          if ($LASTEXITCODE -ne 0) {
            throw 'The AWS Academy credentials on the self-hosted Runner are expired, invalid, or unavailable.'
          }

      - name: Initialize Terraform Local State
        shell: powershell
        working-directory: infrastructure
        run: terraform init -reconfigure

      - name: Deploy application
        shell: powershell
        run: .\scripts\deploy.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure")

      - name: Verify application deployment
        shell: powershell
        run: .\scripts\verify.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure") -RequireBackendHttp

      - name: Verify deployed security
        shell: powershell
        run: .\scripts\security-verify.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure") -Ci
