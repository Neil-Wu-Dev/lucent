name: Infrastructure Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lucent-infrastructure-production
  cancel-in-progress: false

jobs:
  validate-plan-apply:
    name: Validate, plan, and apply Terraform
    runs-on: [self-hosted, Windows, X64]
    permissions:
      id-token: write
      contents: read
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      TF_VAR_database_password: ${{ secrets.TF_VAR_DATABASE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Isolate Runner from persisted AWS credentials
        shell: powershell
        run: |
          @(
            'AWS_PROFILE',
            'AWS_DEFAULT_PROFILE',
            'AWS_SHARED_CREDENTIALS_FILE',
            'AWS_CONFIG_FILE',
            'AWS_ACCESS_KEY_ID',
            'AWS_SECRET_ACCESS_KEY',
            'AWS_SESSION_TOKEN',
            'AWS_ROLE_ARN',
            'AWS_WEB_IDENTITY_TOKEN_FILE'
          ) | ForEach-Object {
            "$_=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Diagnose GitHub OIDC Subject
        shell: powershell
        run: |
          $uri = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com"

          $response = Invoke-RestMethod -Uri $uri -Headers @{
            Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          }

          $part = $response.value.Split('.')[1].Replace('-', '+').Replace('_', '/')
          $part += '=' * ((4 - ($part.Length % 4)) % 4)

          $claims = [System.Text.Encoding]::UTF8.GetString(
            [Convert]::FromBase64String($part)
          ) | ConvertFrom-Json

          Write-Host "OIDC audience: $($claims.aud)"
          Write-Host "OIDC subject: $($claims.sub)"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::228755392058:role/LucentGitHubDeployRole
          aws-region: us-east-1
          role-duration-seconds: 3600
          allowed-account-ids: '228755392058'
          unset-current-credentials: true

      - name: Verify Sandbox AWS identity
        shell: powershell
        run: .\scripts\assert-aws-account.ps1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Prepare Sandbox Local Terraform state
        shell: powershell
        run: .\scripts\manage-local-terraform-state.ps1 -Action Initialize

      - name: Initialize Terraform Local State
        shell: powershell
        working-directory: infrastructure
        run: terraform init -reconfigure

      - name: Back up existing Sandbox Terraform state
        shell: powershell
        run: .\scripts\manage-local-terraform-state.ps1 -Action BackupIfPresent

      - name: Check Terraform formatting
        shell: powershell
        working-directory: infrastructure
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        shell: powershell
        working-directory: infrastructure
        run: terraform validate

      - name: Create Terraform plan
        shell: powershell
        working-directory: infrastructure
        run: terraform plan -out terraform.tfplan

      - name: Apply Terraform plan
        shell: powershell
        working-directory: infrastructure
        run: terraform apply -auto-approve terraform.tfplan

      - name: Verify and back up Local Terraform state
        shell: powershell
        run: |
          .\scripts\manage-local-terraform-state.ps1 -Action Verify
          .\scripts\manage-local-terraform-state.ps1 -Action Backup
      - name: Verify deployed security
        shell: powershell
        run: .\scripts\security-verify.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure") -Ci -InfrastructureOnly
