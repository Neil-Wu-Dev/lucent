name: Infrastructure Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lucent-infrastructure-production
  cancel-in-progress: false

jobs:
  validate-plan-apply:
    name: Validate, plan, and apply Terraform
    runs-on: [self-hosted, Windows, X64]
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_SDK_LOAD_CONFIG: "1"
      TF_VAR_database_password: ${{ secrets.TF_VAR_DATABASE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Verify AWS Academy identity on the self-hosted Runner
        shell: powershell
        run: |
          $credentialsPath = Join-Path $env:USERPROFILE '.aws\credentials'
          if (-not (Test-Path -LiteralPath $credentialsPath -PathType Leaf)) {
            throw "AWS Academy credentials are unavailable on this Runner: $credentialsPath"
          }
          aws sts get-caller-identity --output json
          if ($LASTEXITCODE -ne 0) {
            throw 'The AWS Academy credentials on the self-hosted Runner are expired, invalid, or unavailable.'
          }

      - name: Back up Local Terraform state
        shell: powershell
        run: .\scripts\manage-local-terraform-state.ps1 -Action Backup

      - name: Initialize Terraform Local State
        shell: powershell
        working-directory: infrastructure
        run: terraform init -reconfigure

      - name: Check Terraform formatting
        shell: powershell
        working-directory: infrastructure
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        shell: powershell
        working-directory: infrastructure
        run: terraform validate

      - name: Create Terraform plan
        shell: powershell
        working-directory: infrastructure
        run: terraform plan -out terraform.tfplan

      - name: Apply Terraform plan
        shell: powershell
        working-directory: infrastructure
        run: terraform apply -auto-approve terraform.tfplan

      - name: Verify and back up Local Terraform state
        shell: powershell
        run: |
          .\scripts\manage-local-terraform-state.ps1 -Action Verify
          .\scripts\manage-local-terraform-state.ps1 -Action Backup
      - name: Verify deployed security
        shell: powershell
        run: .\scripts\security-verify.ps1 -ProjectDir $env:GITHUB_WORKSPACE -TerraformDir (Join-Path $env:GITHUB_WORKSPACE "infrastructure") -Ci -InfrastructureOnly
